<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Open Tunes</title>
<style>
:root{--bg:#0a0c10;--pan:#11141a;--card:#171b22;--hov:#1f2530;--fg:#eef1f6;--mut:#8a93a3;--ac:#4f8cff;--ac2:#6db3ff;--grad:linear-gradient(135deg,#4f8cff,#2f5fd6);--tint:#1c2433;--bd:#ffffff14}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;grid-template-columns:250px 1fr;grid-template-rows:1fr auto;gap:10px;padding:10px;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
aside{background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:18px 10px;overflow:auto}
.logo{font-weight:800;font-size:1.25rem;padding:0 12px 16px;display:flex;gap:10px;align-items:center;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-style:normal;color:#fff;font-size:1rem}
aside button.nv{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:9px 12px;border-radius:10px;font-weight:600}
aside button.nv:hover{color:var(--fg);background:#ffffff0a}aside button.nv.on{color:var(--fg);background:var(--hov)}
aside h4{color:var(--mut);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:18px 12px 6px;display:flex;justify-content:space-between;align-items:center}
aside h4 button{background:none;border:0;color:var(--mut);font-size:1.1rem}
main{background:linear-gradient(var(--tint),var(--pan) 380px);border:1px solid var(--bd);border-radius:16px;overflow:auto;padding:0 28px 30px;transition:background .7s}
.top{display:flex;gap:10px;align-items:center;position:sticky;top:0;padding:16px 0 12px;z-index:3;background:linear-gradient(var(--tint) 60%,transparent)}
.top input{flex:1;max-width:460px;padding:12px 18px;border-radius:30px;border:1px solid var(--bd);background:#0007;backdrop-filter:blur(12px);color:#fff;outline:none}
.top input:focus{border-color:var(--ac)}
.hi{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:10px 0 16px}
.hero{display:flex;gap:20px;align-items:flex-end;padding:16px;border-radius:20px;background:#0005;border:1px solid var(--bd);margin-bottom:8px}
.hero .im{width:128px;height:128px;border-radius:14px;background:#333 center/cover;box-shadow:0 16px 44px #000a;flex:none}
.hero small{text-transform:uppercase;letter-spacing:.14em;color:var(--ac2);font-size:.7rem;font-weight:700}
.hero h1{font-size:clamp(1.4rem,3.4vw,2.2rem);line-height:1.1;margin:6px 0;letter-spacing:-.02em}
.hero p{color:var(--mut);margin-bottom:14px}
.go{background:var(--grad);color:#fff;border:0;border-radius:30px;padding:12px 28px;font-weight:700}.go:hover{filter:brightness(1.1)}
.pill{background:#ffffff1c;border:0;padding:8px 16px;border-radius:30px;font-size:.85rem}.pill:hover{background:#ffffff33}
h2{font-size:1.3rem;margin:24px 0 12px;letter-spacing:-.01em}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x proximity;align-items:flex-start;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--bd);padding:9px;border-radius:12px;cursor:pointer;transition:.2s;flex:0 0 132px;width:132px;min-width:0;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}.grid .card{flex:auto;width:auto}
.card:hover{background:var(--hov);transform:translateY(-3px)}
.card .im{aspect-ratio:1;border-radius:9px;background:#222 center/cover;margin-bottom:8px;box-shadow:0 4px 12px #0007;position:relative}
.card .im img,.qi .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.card .pl{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;border:0;opacity:0;transform:translateY(8px);transition:.2s}
.card .sv{position:absolute;left:6px;top:6px;width:28px;height:28px;border-radius:50%;background:#000a;border:0;backdrop-filter:blur(6px);opacity:0;transition:.2s}
.card:hover .pl,.card.cur .pl,.card:hover .sv{opacity:1;transform:none}
@media(hover:none){.card .sv,.card .pl{opacity:1;transform:none}}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{font-size:.88rem}.card span{color:var(--mut);font-size:.78rem}.card.cur b{color:var(--ac2)}
.sk{height:176px;align-self:flex-start;flex:0 0 132px;border-radius:14px;background:linear-gradient(90deg,#171b22,#1f2530,#171b22);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.more{display:block;margin:22px auto 0;padding:11px 30px}
footer{grid-column:1/3;background:var(--pan);border:1px solid var(--bd);border-radius:16px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:16px;padding:8px 14px;position:relative}
.np{display:flex;gap:12px;align-items:center;min-width:0;cursor:pointer}
.np .im{width:56px;height:56px;border-radius:10px;background:#222 center/cover;flex:none}
.np div{min-width:0}.np b,.np span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np span{color:var(--mut);font-size:.8rem}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;gap:16px;align-items:center}
.btns button{background:none;border:0;color:var(--mut);font-size:1.15rem}.btns button:hover{color:var(--fg)}.btns button.on{color:var(--ac2)}
.btns .big{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;font-size:1rem}.btns .big:hover{transform:scale(1.07);color:#fff}
.seek{display:flex;gap:8px;align-items:center;width:100%;max-width:580px;color:var(--mut);font-size:.75rem}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#ffffff26;flex:1;outline:none;accent-color:var(--ac2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.rt{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.rt button,.rt label{background:none;border:0;color:var(--mut);padding:7px 9px;border-radius:10px;font-size:.85rem;white-space:nowrap;cursor:pointer}
.rt button:hover,.rt label:hover{color:#fff;background:#ffffff14}.rt .on{color:var(--ac2)}
#vol{max-width:80px}
#cap{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);background:#000c;backdrop-filter:blur(8px);padding:8px 18px;border-radius:12px;font-size:1.1rem;font-weight:700;text-align:center;max-width:90vw;display:none}
#q2{position:fixed;right:10px;top:10px;bottom:100px;width:350px;background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:16px;overflow:auto;transform:translateX(115%);transition:.3s;z-index:6;box-shadow:0 0 50px #000a}
#q2.on{transform:none}
.qi{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;cursor:pointer}.qi:hover{background:var(--hov)}
.qi .im{width:42px;height:42px;border-radius:8px;background:#222 center/cover;flex:none;position:relative}.qi div{min-width:0}.qi b,.qi span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qi span{font-size:.78rem;color:var(--mut)}.qi.cur b{color:var(--ac2)}
#full{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:#000;overflow:hidden}
#full.on{display:flex}
#fbg{position:absolute;inset:-40px;background:center/cover;filter:blur(60px) brightness(.45) saturate(1.4);z-index:-1}
#fart{width:min(60vw,320px);aspect-ratio:1;border-radius:18px;background:#222 center/cover;box-shadow:0 20px 60px #000a}
#fx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:#ffffff22;border:0;border-radius:50%;width:42px;height:42px;font-size:1.1rem}
#fl{font-size:clamp(1.3rem,4vw,2.2rem);font-weight:800;min-height:3em;max-width:760px;display:flex;align-items:center}
.eq{display:flex;gap:4px;height:28px;align-items:flex-end}.eq i{width:5px;background:var(--grad);border-radius:3px;height:6px}
.playing .eq i{animation:eq .9s infinite ease-in-out}.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.45s!important}.eq i:nth-child(4){animation-delay:.1s!important}.eq i:nth-child(5){animation-delay:.35s!important}
@keyframes eq{50%{height:28px}}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
svg.i.s{fill:currentColor;stroke:none}svg.i.f{fill:currentColor}
aside button.nv svg{margin-right:10px}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;padding:0!important;border-radius:50%!important;background:#ffffff0f!important;border:1px solid var(--bd)!important;color:var(--fg)!important;text-decoration:none;cursor:pointer;transition:.15s}
.ib:hover{background:#ffffff22!important;transform:translateY(-1px)}
.ib.on{color:var(--ac2)!important;border-color:var(--ac2)!important}
.ib.big{width:62px;height:62px;background:var(--grad)!important;color:#fff!important;border:0!important}.ib.big svg.i{width:26px;height:26px}
.np{padding:6px;border-radius:14px;transition:.15s}.np:hover{background:#ffffff0f}
.np .xp{margin-left:auto;color:var(--mut);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#ffffff0f;flex:none}
.card .pl,.card .sv{display:grid;place-items:center;padding:0}.card .pl svg.i,.card .sv svg.i{width:15px;height:15px}
.fctl{width:min(92vw,520px);display:flex;flex-direction:column;gap:14px;align-items:center}
.fbt{display:flex;gap:14px;align-items:center}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:10}.modal.on{display:grid}
.modal>div{background:var(--card);border:1px solid var(--bd);padding:22px;border-radius:16px;max-width:400px;width:90%;max-height:80vh;overflow:auto}
.modal .opt{display:block;width:100%;text-align:left;background:#ffffff10;border:0;border-radius:10px;padding:11px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#fff;color:#080a14;padding:10px 20px;border-radius:30px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:12}#toast.on{opacity:1}
@media(max-width:780px){
 body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;padding:6px;gap:6px}
 aside{padding:6px;display:flex;overflow-x:auto;gap:4px;border-radius:12px}.logo,aside h4,#pls,#genres{display:none}aside button.nv{width:auto;white-space:nowrap}
 main{padding:0 16px 24px}
 footer{grid-column:1;grid-template-columns:1fr auto;padding:8px 10px}.ctl{grid-row:2;grid-column:1/3}.hide{display:none}
 .hero{flex-direction:column;align-items:flex-start}.hero .im{width:96px;height:96px}
 #q2{width:calc(100% - 20px)}
}
.np .im,#fart{position:relative;overflow:hidden}
.np .im img,#fart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.playing #fart{box-shadow:0 24px 90px #4f8cff55,0 20px 60px #000a}
#fa a,.hero p a{color:var(--fg);cursor:pointer;font-weight:600;border-bottom:1px solid #fff4}#fa a:hover,.hero p a:hover{border-color:var(--ac2)}
.card.ar{text-align:center}.card.ar .im{border-radius:50%}
.tg{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;background:#000b;color:var(--ac2);letter-spacing:.05em}
.hero .im.r{border-radius:50%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px;align-items:center}
.chip{background:#ffffff12;border:1px solid var(--bd);padding:7px 16px;border-radius:30px;font-size:.84rem;font-weight:600;color:var(--mut);transition:.15s}.chip:hover{color:var(--fg);background:#ffffff1f}.chip.on{background:var(--fg);color:#0a0c10;border-color:transparent}
.chips .sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
</style></head><body>
<aside><div class="logo"><i>♪</i>Open Tunes</div>
<button class="nv on" data-v="home">Home</button><button class="nv" data-v="charts">Top charts</button><button class="nv" data-v="artists">Artists</button><button class="nv" data-v="albums">Albums</button><button class="nv" data-v="new">New releases</button>
<h4>Your library</h4>
<button class="nv" data-v="hist">Recently played</button><button class="nv" data-v="liked">Liked songs</button><button class="nv" data-v="dls">Saved to device</button>
<h4>Genres</h4><div id="genres"></div>
<h4>Playlists <button id="newpl" title="New playlist">＋</button></h4><div id="pls"></div></aside>
<main id="main"><div class="top"><input id="q" type="search" placeholder="Search songs, artists, albums…" aria-label="Search"></div><div id="view"></div></main>
<footer>
<div id="cap"></div>
<div class="np" id="npb" role="button" tabindex="0" title="Open player"><div class="im" id="art"></div><div><b id="ttl">Nothing playing</b><span id="art2">Pick a song</span></div><i class="xp" id="xp"></i></div>
<div class="ctl"><div class="btns"><button id="shuf" title="Shuffle"></button><button id="prev" title="Previous"></button><button id="pp" class="big" title="Play / Pause"></button><button id="next" title="Next"></button><button id="rep" title="Repeat"></button></div>
<div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="dur">0:00</span></div></div>
<div class="rt"><button id="like" class="ib" title="Like"></button><button id="dlb" class="ib" title="Save to device"></button><button id="add" class="ib hide" title="Add to playlist"></button><label class="ib hide" id="ccl" title="Load subtitle file"><input type="file" id="fs" accept=".srt,.vtt" hidden></label><button id="cc" class="ib on hide" title="Subtitles on/off"></button><button id="qb" class="ib" title="Up next"></button><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" class="hide" aria-label="Volume"></div>
</footer>
<div id="q2"><h2 style="margin-top:0">Up next</h2><div id="ql"></div></div>
<div id="full"><div id="fbg"></div><button id="fx">✕</button><div id="fart"></div><div><h1 id="ft">Nothing playing</h1><p id="fa" style="color:var(--mut)"></p></div><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div id="fl"></div><div class="fctl"><div class="seek"><span id="fcur">0:00</span><input type="range" id="fsk" min="0" max="1000" value="0" aria-label="Seek"><span id="fdur">0:00</span></div><div class="fbt"><button class="ib" id="flike" title="Like"></button><button class="ib" id="fprev" title="Previous"></button><button class="ib big" id="fpp" title="Play / Pause"></button><button class="ib" id="fnext" title="Next"></button><button class="ib" id="fdl" title="Save to device"></button><a class="ib" id="flink" target="_blank" rel="noopener" title="Open song page" style="display:none"></a></div></div></div>
<div class="modal" id="pm"><div><h2>Add to playlist</h2><br><div id="pml"></div></div></div>
<div id="toast"></div><audio id="au"></audio>
<script>
/* ===== API KEYS (Jamendo client IDs) =====
   Add more keys to this list. If one fails or hits its limit, the next one is used automatically. */
const KEYS=[
 '6b773d55',
 // 'second_client_id',
 // 'third_client_id',
];
/* Optional: Openverse access token (higher limits). Leave empty to use the free anonymous tier. */
const OV_TOKEN='';
const $=s=>document.querySelector(s),au=$('#au');
const IC={
 heart:'<path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.7 3.7 4.5 7 4.5c2 0 3.700 1.100 5 3 1.300-1.900 3-3 5-3 3.300 0 5.400 3.200 4.200 6.600-1.700 4.800-9.200 9.400-9.200 9.400z"/>',
 download:'<path d="M12 3v12m0 0l-4.500-4.500M12 15l4.500-4.500M4 20h16"/>',
 play:'<path d="M7 4.500v15l12-7.500z"/>',
 pause:'<path d="M7 4.500h3.500v15H7zM13.500 4.500H17v15h-3.500z"/>',
 next:'<path d="M5 5l10 7-10 7zM19 5v14"/>',
 prev:'<path d="M19 5L9 12l10 7zM5 5v14"/>',
 shuffle:'<path d="M16 4h4v4M20 4L4 20M20 16v4h-4M14 14l6 6M4 4l5 5"/>',
 repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>',
 queue:'<path d="M4 6h12M4 12h10M4 18h7M17 14v7l5-3.500z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 cc:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.500a2 2 0 100 3M17 10.500a2 2 0 100 3"/>',
 file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h4"/>',
 up:'<path d="M5 15l7-7 7 7"/>',
 link:'<path d="M10 14a4 4 0 005.700 0l3-3a4 4 0 00-5.700-5.700l-1 1M14 10a4 4 0 00-5.700 0l-3 3a4 4 0 005.700 5.700l1-1"/>',
 home:'<path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/>',
 spark:'<path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 note:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',disc:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'};
const ico=(n,c)=>`<svg class="i ${c||''}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const G=['pop','rock','electronic','hiphop','jazz','classical','ambient','lounge','folk','metal','reggae','blues','country','soundtrack','relaxation','techno','house','indie','dance','rnb','latin','world'];
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
let ki=0,Q=[],i=-1,subs=[],ccOn=true,shuf=false,rep=false,lists=[],V=null,liked=L('liked',{}),pls=L('pls',{}),dls=L('dls',{}),hist=L('hist',[]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)};
const save=()=>{['liked','pls','dls','hist'].forEach(k=>localStorage.setItem(k,JSON.stringify({liked,pls,dls,hist}[k])))};
const AC={};
async function api(p){const k=JSON.stringify(p);if(AC[k])return AC[k];const r=await apiRaw(p);if(r.length)AC[k]=r;return r}
async function apiRaw(p){
 for(let n=0;n<KEYS.length;n++){const k=KEYS[(ki+n)%KEYS.length];
  const u=new URL('https://api.jamendo.com/v3.0/tracks/');
  Object.entries({client_id:k,format:'json',limit:12,imagesize:200,audiodlformat:'mp32',...p}).forEach(([a,b])=>u.searchParams.set(a,b));
  try{const j=await(await fetch(u)).json();if(j.headers&&j.headers.status==='failed')continue;ki=(ki+n)%KEYS.length;return j.results||[]}catch(e){}}
 toast('Could not load music. Please try again.');return[]}
async function ov(p){
 const q=p.search||p.tags||'music',sz=Math.min(p.limit||20,20);
 const u=new URL('https://api.openverse.org/v1/audio/');
 u.search=new URLSearchParams({q,page_size:sz,category:'music',page:Math.floor((p.offset||0)/(p.limit||20))+1});
 try{const r=await fetch(u,OV_TOKEN?{headers:{Authorization:'Bearer '+OV_TOKEN}}:{});const j=await r.json();
  return(j.results||[]).filter(x=>x.url).map(x=>({id:'ov'+x.id,name:x.title||'Untitled',artist_name:x.creator||'Unknown artist',image:x.thumbnail||'',audio:x.url,audiodownload:x.url,audiodownload_allowed:true,license:x.license?'CC '+String(x.license).toUpperCase():'',src:'Openverse',page:x.foreign_landing_url||''}))}catch(e){return[]}}
const bg=u=>u?`background-image:url('${esc(u)}')`:'background:linear-gradient(135deg,#2b3342,#161a21)';
